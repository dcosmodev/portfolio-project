<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="script.js"></script>
  </head>
  <body class="container">
    <header class="header">
      <nav class="header__menu">
        <!-- semantic tag that helps navigate the sites -->
        <a class="header__menu__link" href="index.html">Home</a>
        <a class="header__menu__link" href="about.html">About Me</a>
        <a class="header__menu__link" href="contact.html">Contact</a>
        <div>
          <input type="checkbox" class="checkbox" id="chk" />
          <label class="label" for="chk">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
            <div class="ball"></div>
          </label>
        </div>
      </nav>
    </header>
    <div class="titulo">
      <h1 id="titulo">Contato</h1>
      <br />
    </div>
    <form>
      <fieldset class="grupo">
        <div class="campo">
          <label for="nome">
            <strong>Nome</strong>
          </label>
          <input
            type="text"
            name="nome"
            id="nome"
            placeholder="Digite seu Nome"
            required
          />
        </div>
      </fieldset>
      <fieldset>
        <div class="campo">
          <label for="email">
            <strong>Email</strong>
          </label>
          <input
            type="text"
            name="email"
            id="email"
            placeholder="Digite seu Email"
            required
          />
        </div>
      </fieldset>
      <div class="campo">
        <br />
        <label>
          <strong>Mensagem</strong>
        </label>
        <textarea
          row="6"
          style="width: 29.5em"
          id="mensagem"
          name="Mensagem"
        ></textarea>
      </div>
      <button class="botao" type="submit">Enviar</button>
    </form>
    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/998c60ef77.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
